<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214f45"><title>Sân chùa An Nhiên</title><link rel="stylesheet" href="style.css"></head><body class="game-page"><canvas id="world" aria-label="Sân chùa tương tác: chạm để di chuyển, chạm đồ vật để đến gần, kéo để tương tác." tabindex="0"></canvas><header class="game-hud"><button id="profile" class="player-hud"><span class="portrait">🧑‍🦲</span><span><b id="playerName">Khách hành hương</b><small id="levelText">Cấp 1 · Mầm thiện</small><span class="xp-track"><i id="xpFill"></i></span></span><strong id="levelBadge">1</strong></button><div class="hud-right"><span class="currency">✦ <b id="merit">0</b></span><button id="weather" class="hud-circle" title="Thời tiết mô phỏng">☀</button><button id="settings" class="hud-circle" aria-label="Cài đặt trò chơi">⚙</button></div></header><div class="place-label"><span id="mapName">AN NHIÊN TỰ</span><small id="onlineStatus">🌱 Một mình · Lưu trên máy</small></div><div class="world-rail"><button id="questsButton" title="Nhiệm vụ"><span>📜</span><small>Việc lành</small><i id="questBadge">0/3</i></button><button id="leaderButton" title="Bảng công đức"><span>🏆</span><small>Công đức</small></button><button id="friendsButton" title="Bạn đồng hành"><span>🤝</span><small>Bạn bè</small><i id="friendsCount">0</i></button></div><button id="enterHall" class="enter-hall">⛩ Vào chính điện <span>→</span></button><nav id="hallActions" class="hall-actions" aria-label="Sinh hoạt chính điện" hidden><button data-hall-task="prostrate">🙏 Lạy Phật</button><button data-hall-task="meal">🍚 Ăn chay</button><button data-hall-task="sermon">🪷 Nghe pháp</button></nav><div id="hint" class="game-hint"><span>☝</span> Chạm vào sân để đi · Chạm đồ vật để khám phá</div><div class="game-dock"><button id="homeButton" class="dock-active"><span>⛩</span><small>Sân chùa</small></button><button id="emoteButton"><span>🙏</span><small>Chào bạn</small></button><button id="wishButton"><span>🏮</span><small>Tâm nguyện</small></button><button id="helpButton"><span>🧭</span><small>Cách chơi</small></button></div><div id="toast" role="status" aria-live="polite"></div><dialog id="panel"><button class="panel-close" aria-label="Đóng">×</button><div id="panelContent"></div></dialog><dialog id="activityScreen" aria-labelledby="activityTitle"><header class="activity-header"><button id="activityClose" aria-label="Đóng nhiệm vụ">← Về chùa</button><span>AN NHIÊN · MỖI NHỊP MỘT ĐIỀU LÀNH</span><strong id="activityScore">0 XP</strong></header><div class="activity-heading"><h1 id="activityTitle"></h1><p id="activityInstruction"></p></div><canvas id="activityCanvas" tabindex="0" role="button" aria-label="Tương tác nhiệm vụ: vuốt theo hướng dẫn hoặc chạm đồ vật. Có thể dùng Enter hoặc phím cách."></canvas><section class="activity-footer"><p id="activityReading" aria-live="polite" hidden></p><button id="activityRead" hidden>🔊 Đọc lời giảng</button><b id="activityCount">0 thao tác</b><p id="activityStatus" role="status"></p><button id="activityRetry" hidden>Thử lưu lại</button><small>Không giới hạn lượt chơi · Mỗi thao tác đúng +1 XP</small></section></dialog><script src="config.js"></script><script type="module" src="game.js"></script></body></html>
